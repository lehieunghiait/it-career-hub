version: '3.8'

services:
  it-career-hub-uat:
    image: ghcr.io/${GITHUB_REPOSITORY}:uat
    container_name: it-career-hub-uat
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - NODE_ENV=production
    networks:
      - career-hub-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  it-career-hub-prod:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: it-career-hub-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    networks:
      - career-hub-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  career-hub-network:
    driver: bridge