name: Frontend CI/CD (S3 + CloudFront)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------
  # CI: chạy cho mọi PR vào main và mỗi lần push main
  # ---------------------------------------------------------------
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint:ts
      # Đang có file chưa format: chỉ cảnh báo. Chạy `npm run prettier:format` rồi bỏ continue-on-error.
      - run: npm run prettier:check
        continue-on-error: true
      - run: npm run build

  # ---------------------------------------------------------------
  # CD: push main (hoặc chạy tay) -> production
  # ---------------------------------------------------------------
  deploy:
    name: Deploy production
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC -> AWS
      contents: read
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: frontend-deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Vite nhúng biến VITE_* lúc build
      - name: Build
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          # 1) dist/assets: tên file có hash -> cache 1 năm
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

          # 2) File tĩnh ở thư mục gốc (vite.svg, ...) không có hash -> cache 1 giờ
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public,max-age=3600" \
            --only-show-errors

          # 3) index.html -> không cache, upload sau cùng để không trỏ tới asset chưa tồn tại
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

          # 4) Dọn file của bản build cũ (vẫn còn trong S3 versioning 30 ngày)
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" --delete --only-show-errors

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_ID }}" \
            --paths "/" "/index.html" \
            --query 'Invalidation.Id' --output text

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.APP_URL }}")
            [ "$code" = "200" ] && echo "OK ($code)" && exit 0
            echo "Attempt $i: HTTP $code, retry..."; sleep 10
          done
          exit 1

      - name: Summary
        run: |
          {
            echo "### Frontend deployed to production"
            echo "- URL: ${{ vars.APP_URL }}"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
