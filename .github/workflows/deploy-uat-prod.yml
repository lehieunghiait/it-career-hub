name: Deploy to UAT and Production

on:
  push:
    branches:
      - develop  # Trigger UAT deployment
      - main     # Trigger Production deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - uat
          - production

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'it-career-hub' }}

jobs:
  # Job 1: Determine target environment
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: 🎯 Determine environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=uat" >> $GITHUB_OUTPUT
          fi

  # Job 2: Build and Push Docker Image to Amazon ECR
  build:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📝 Set image tags
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          IMAGE_BASE=${REGISTRY}/${ECR_REPOSITORY}
          echo "image=${IMAGE_BASE}:${ENVIRONMENT}-${{ github.sha }}" >> $GITHUB_OUTPUT
          {
            echo "tags<<EOF"
            echo "${IMAGE_BASE}:${ENVIRONMENT}-${{ github.sha }}"
            echo "${IMAGE_BASE}:${ENVIRONMENT}"
            if [[ "$ENVIRONMENT" == "production" ]]; then
              echo "${IMAGE_BASE}:latest"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            BUILD_ENV=${{ needs.setup.outputs.environment }}
            VITE_BACKEND_URL=${{ needs.setup.outputs.environment == 'production' && secrets.PROD_BACKEND_URL || secrets.UAT_BACKEND_URL }}
            VITE_APP_NAME=${{ needs.setup.outputs.environment == 'production' && 'Career Hub' || 'Career Hub - UAT' }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ needs.setup.outputs.environment == 'production' && secrets.PROD_CLERK_PUBLISHABLE_KEY || secrets.UAT_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Deploy to Amazon ECS
  deploy:
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.setup.outputs.environment }}
      url: ${{ vars.APP_URL }}
    env:
      ENVIRONMENT: ${{ needs.setup.outputs.environment }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || format('it-career-hub-{0}', needs.setup.outputs.environment) }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || format('it-career-hub-{0}', needs.setup.outputs.environment) }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION || format('it-career-hub-{0}', needs.setup.outputs.environment) }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'it-career-hub' }}

    steps:
      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📥 Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${ECS_TASK_DEFINITION} \
            --query taskDefinition > task-definition.json

      - name: 📝 Render new task definition with image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}

      - name: 🚀 Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: ✅ Deployment Summary
        run: |
          echo "### 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${ENVIRONMENT}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ needs.build.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster / Service:** ${ECS_CLUSTER} / ${ECS_SERVICE}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ vars.APP_URL || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # Job 4: Health Check (runs only when APP_URL is configured for the environment)
  health-check:
    needs: [setup, deploy]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: 🏥 Check application health
        env:
          URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "APP_URL not set, skipping health check"
            exit 0
          fi

          for i in {1..5}; do
            if curl -f -s -o /dev/null -w "%{http_code}" ${URL} | grep -q "200"; then
              echo "✅ Application is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

          echo "❌ Health check failed"
          exit 1
